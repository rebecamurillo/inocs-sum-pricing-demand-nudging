name: demo-ci

on:
  push:
    paths:
      - 'demo/**'
      - 'sum_nsm_dynamic_pricing/**'
      - '.github/workflows/demo-ci.yml'
  pull_request:
    paths:
      - 'demo/**'
      - 'sum_nsm_dynamic_pricing/**'
      - '.github/workflows/demo-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: demo

env:
  GIT_LFS_SKIP_SMUDGE: '1'

# Actions are pinned to the commit of an exact release.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.9'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: make install PLAYWRIGHT_ARGS=
      - run: make check

  # The unmodified pricing package on committed fixtures: no licence, trip planner or internet.
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.9'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: make install PLAYWRIGHT_ARGS=
      - run: make test-model

  # The repositories and the migrations run against a throwaway PostgreSQL that the target
  # starts in Docker and removes.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.9'
      - run: uv --directory api sync --locked
      - run: make test-integration

  # The API and the web app are built into images by the e2e stack, so only the suite's own
  # dependencies and the browser are installed on the runner.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm --prefix e2e ci
      - run: npm --prefix e2e exec -- playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            demo/e2e/playwright-report
            demo/e2e/test-results/stack.log
          retention-days: 14
